name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  release:
    permissions:
      contents: write
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Setup LLVM (needed by whisper-rs's bindgen build step)
        uses: KyleMayes/install-llvm-action@v2
        with:
          version: "18"

      - name: Install frontend dependencies
        run: npm install

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          LIBCLANG_PATH: ${{ env.LIBCLANG_PATH }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "notita ${{ github.ref_name }}"
          releaseBody: "New notita release. Download the installer below — the app can also update itself in-place via Settings > Updates."
          releaseDraft: false
          prerelease: false
